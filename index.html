<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdoStore | وجهتك الموثوقة للحسابات الرقمية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-gold: rgba(212, 175, 55, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin: 30px 0;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        header h1 {
            color: var(--gold);
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            flex: 1;
        }
        .section-title {
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-right: 4px solid var(--gold);
            padding-right: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-gold);
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex: 1;
            line-height: 1.4;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .price {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .buy-btn {
            background-color: var(--gold);
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .buy-btn:hover {
            background-color: var(--gold-light);
        }
        .empty-msg, .loading-msg {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.1rem;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>KurdoStore</h1>
        <p>وجهتك الموثوقة للحسابات الرقمية والألعاب الأصلية</p>
    </header>

    <div class="container">
        <h2 class="section-title">الحسابات المتوفرة حالياً</h2>
        <div id="products-grid" class="grid">
            <div class="loading-msg">جاري تحميل الحسابات...</div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; KurdoStore 2026
    </footer>

    <script>
        const SUPABASE_URL = 'https://lxfjvksxsuwmvixqautv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4Zmp2a3N4c3V3bXZpeHFhdXR2IjsxMGxlIjoiYW5vbiIsImlhdCI6MTc5NDg0ODY5NSwiZXhwIjoyMTEwNDI0Njk1fQ.hPGN7e04cL3YQXpLz2hqkmsE_TMHaGh-4ANirJoEVpU';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            
            try {
                const { data, error } = await _supabase
                    .from('accounts')
                    .select('*')
                    .eq('status', 'available');

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">لا توجد حسابات متاحة حالياً.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const imageUrl = item['image-url'] || 'https://via.placeholder.com/300x160/161616/d4af37?text=KurdoStore';
                    const title = item.title || 'حساب رقمي';
                    const description = item.description || 'بدون تفاصيل إضافية';
                    const price = item.price ? `${item.price}` : '';
                    
                    const telegramUrl = `https://t.me/yousifmziri?text=مرحباً، أريد شراء هذا الحساب: ${encodeURIComponent(title)}`;

                    card.innerHTML = `
                        <img src="${imageUrl}" alt="${title}" onerror="this.src='https://via.placeholder.com/300x160/161616/d4af37?text=KurdoStore'">
                        <div class="card-content">
                            <div class="card-title">${title}</div>
                            <div class="card-desc">${description}</div>
                            <div class="card-footer">
                                <div class="price">${price}</div>
                                <a href="${telegramUrl}" target="_blank" class="buy-btn">شراء</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error('Error loading products:', err);
                grid.innerHTML = `<div class="empty-msg">حدث خطأ أثناء تحميل المنتجات. تأكد من إعدادات الاتصال.</div>`;
            }
        }

        loadProducts();
    </script>
</body>
</html>
