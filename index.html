<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdoStore | وجهتك الموثوقة للحسابات الرقمية</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-gold: rgba(212, 175, 55, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin: 30px 0;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        header h1 {
            color: var(--gold);
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            flex: 1;
        }
        .section-title {
            color: var(--gold);
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-right: 4px solid var(--gold);
            padding-right: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-gold);
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex: 1;
            line-height: 1.4;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .price {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .buy-btn {
            background-color: var(--gold);
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .buy-btn:hover {
            background-color: var(--gold-light);
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>KurdoStore</h1>
        <p>وجهتك الموثوقة للحسابات الرقمية والألعاب الأصلية</p>
    </header>

    <div class="container">
        <h2 class="section-title">الحسابات المتوفرة حالياً</h2>
        <div id="products-grid" class="grid">
            <!-- المنتجات المعروضة مباشرة لتجنب مشاكل الاتصال -->
            <div class="card">
                <img src="https://i.postimg.cc/nzrqLjKw/IMG-288..." alt="حساب Apple ID (توم ريدر + ماينكرافت)">
                <div class="card-content">
                    <div class="card-title">حساب Apple ID (توم ريدر + ماينكرافت)</div>
                    <div class="card-desc">حساب أبل ستور مشحون ومشتراة فيه الألعاب الأصلية بالكامل</div>
                    <div class="card-footer">
                        <div class="price">4$</div>
                        <a href="https://t.me/yousifmziri?text=مرحباً، أريد شراء حساب Apple ID (توم ريدر + ماينكرافت)" target="_blank" class="buy-btn">شراء</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="https://i.postimg.cc/8cVWmKg1/IMG-2..." alt="حساب Apple ID (ماينكرافت)">
                <div class="card-content">
                    <div class="card-title">حساب Apple ID (ماينكرافت)</div>
                    <div class="card-desc">حساب أبل ستور مشحون ومشتراة فيه الألعاب</div>
                    <div class="card-footer">
                        <div class="price">1$</div>
                        <a href="https://t.me/yousifmziri?text=مرحباً، أريد شراء حساب Apple ID (ماينكرافت)" target="_blank" class="buy-btn">شراء</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; KurdoStore 2026
    </footer>
</body>
</html>
